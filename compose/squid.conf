# Squid proxy configuration for local development
# Allows HTTP CONNECT tunnelling to both HTTPS (443) and SSH/SFTP (22)

# Source networks allowed to use this proxy
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

# Destination ports/methods allowed by policy
acl SSL_ports port 443
acl SSH_ports port 22
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 22
acl CONNECT method CONNECT

# Access rules are evaluated top-down (first match wins)
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports !SSH_ports
http_access allow localnet
http_access allow localhost
http_access deny all

# Proxy listener port
http_port 3128

# Core dump location for diagnostics
coredump_dir /var/spool/squid
